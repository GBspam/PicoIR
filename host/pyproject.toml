[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "picoir-gameboy"
version = "0.1.0"
description = "Python host library for PicoIR Game Boy Color IR packet transfers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PicoIR contributors" }]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
picoir-gameboy = "picoir_gameboy.__main__:main"

[tool.setuptools]
packages = ["picoir_gameboy"]
