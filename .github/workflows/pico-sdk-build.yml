name: Pico SDK build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pico-sdk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive
      - name: Configure Pico backend
        run: cmake -S firmware/pico -B build-pico -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=pico -DPICOIR_BUILD_HARDWARE_TESTS=ON
      - name: Build Pico backend
        run: cmake --build build-pico --parallel
